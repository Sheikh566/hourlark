name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Deploy only main, and only in repositories that set the CLOUDFLARE_ACCOUNT_ID variable.
    # Manual runs on other branches, and forks that have not configured deployment, are skipped.
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      HOURLARK_WRANGLER_CONFIG: wrangler.deploy.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        # Runs against the committed wrangler.jsonc; the deploy build below uses the generated config.
        run: pnpm validate
        env:
          HOURLARK_WRANGLER_CONFIG: ""

      - name: Require Cloudflare API token
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Generate deployment configuration
        run: pnpm deploy:configure
        env:
          HOURLARK_WORKER_NAME: ${{ vars.HOURLARK_WORKER_NAME }}
          HOURLARK_D1_DATABASE_NAME: ${{ vars.HOURLARK_D1_DATABASE_NAME }}
          HOURLARK_DOMAIN: ${{ vars.HOURLARK_DOMAIN }}
          AUTH_MODE: ${{ vars.AUTH_MODE }}
          APP_NAME: ${{ vars.APP_NAME }}
          COMPANY_NAME: ${{ vars.COMPANY_NAME }}
          COMPANY_DOMAIN: ${{ vars.COMPANY_DOMAIN }}
          DEFAULT_TIMEZONE: ${{ vars.DEFAULT_TIMEZONE }}
          DEFAULT_CURRENCY: ${{ vars.DEFAULT_CURRENCY }}
          DEFAULT_WEEK_START: ${{ vars.DEFAULT_WEEK_START }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          BOOTSTRAP_ADMIN_EMAILS: ${{ vars.BOOTSTRAP_ADMIN_EMAILS }}

      - name: Check production configuration
        run: pnpm check:production

      - name: Build
        run: pnpm build

      - name: Record D1 restore point
        run: |
          bookmark="$(pnpm exec wrangler d1 time-travel info DB --config wrangler.deploy.json --json | jq -er '.bookmark')"
          {
            echo "### D1 restore point"
            echo
            echo "Bookmark taken before migrations. To roll back the database:"
            echo
            echo '```bash'
            echo "pnpm exec wrangler d1 time-travel restore DB --config wrangler.deploy.json --bookmark=$bookmark"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply remote D1 migrations
        run: pnpm db:migrate:remote

      - name: Deploy Worker
        # Worker secrets set in this repository are uploaded with the deploy. Wrangler adds them
        # to the Worker's existing secrets; secrets not set here are kept as they are.
        env:
          CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          (umask 077; jq -n 'env | {CSRF_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET}
            | with_entries(select(.value != null and .value != ""))' > "$secrets_file")
          if [ "$(jq length "$secrets_file")" -gt 0 ]; then
            pnpm exec wrangler deploy --secrets-file "$secrets_file"
          else
            pnpm exec wrangler deploy
          fi
          rm -f "$secrets_file"
