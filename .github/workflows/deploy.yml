name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Deploy only main from this repository; manual runs on other branches and forks are skipped.
    if: github.repository == 'Sheikh566/hourlark' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check production configuration
        run: pnpm check:production

      - name: Validate and build
        run: pnpm validate

      - name: Require Cloudflare API token
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Record D1 restore point
        run: |
          bookmark="$(pnpm exec wrangler d1 time-travel info DB --json | jq -er '.bookmark')"
          {
            echo "### D1 restore point"
            echo
            echo "Bookmark taken before migrations. To roll back the database:"
            echo
            echo '```bash'
            echo "pnpm exec wrangler d1 time-travel restore DB --bookmark=$bookmark"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply remote D1 migrations
        run: pnpm db:migrate:remote

      - name: Deploy Worker
        run: pnpm exec wrangler deploy
