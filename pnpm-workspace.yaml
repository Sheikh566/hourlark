saveExact: true
autoInstallPeers: true
strictPeerDependencies: true
allowBuilds:
  esbuild: true
  workerd: true

# Keep exact reviewed versions during pnpm and dependency refreshes.
# Other versions still use pnpm's default 24-hour release-age gate.
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261004.1"
  - "hono@4.13.13"
  - "jsdom@30.1.2"
  - "lucide-react@1.52.0"
  - "tr46@7.0.0"
  - "whatwg-url@17.2.0"
  - data-urls@8.0.0
